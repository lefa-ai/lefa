<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lefa — Design System Lab</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%2318181b'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='3' stroke-linejoin='round'%3E%3Cpolygon points='24,6 41.119,18.438 34.58,38.562 13.42,38.562 6.881,18.438'/%3E%3C/g%3E%3Ccircle cx='24' cy='24' r='4.5' fill='%23fff'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Fira+Code:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="ds.css" />
</head>
<body>

<div class="wrap">
  <div class="page-h">
    <h1>Design system lab</h1>
    <p>Pick the system piece by piece — every choice applies live across all pages and persists.
       Tailwind color values, shadcn-style tokens and components, dark mode.
       When it feels right, copy the token export below.</p>
  </div>

  <section class="block">
    <h2>Pick</h2>
    <div class="opts wide" id="hub-links"></div>
  </section>

  <section class="block">
    <h2>Preview — current system</h2>
    <div class="preview" id="hub-preview"></div>
  </section>

  <section class="block">
    <h2>Token export — CSS variables</h2>
    <div class="codeblock" id="hub-export" style="white-space:pre"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn btn-secondary" id="hub-copy">Copy tokens</button>
      <button class="btn btn-ghost" id="hub-reset">Reset all choices</button>
    </div>
  </section>
</div>

<script src="ds.js"></script>
<script>
"use strict";
dsNav("index.html");

const hubLinks = document.getElementById("hub-links");
function renderLinks() {
  hubLinks.innerHTML = "";
  [
    { file: "colors.html", label: "Colors", note: () => DS.accent + "-" + DS.shade + " on " + DS.neutral },
    { file: "type.html", label: "Typography", note: () => DS.fontHeading + " / " + DS.fontBody + " / " + DS.fontMono },
    { file: "spacing.html", label: "Spacing & radius", note: () => DS.density + " · radius " + DS.radius + "rem" },
    { file: "components.html", label: "Components", note: () => "the whole kit, assembled" },
  ].forEach((p) => {
    const a = document.createElement("a");
    a.className = "opt big";
    a.style.textDecoration = "none";
    a.href = p.file;
    a.innerHTML = '<span class="opt-label">' + p.label + ' →</span><span class="opt-note">' + p.note() + "</span>";
    hubLinks.appendChild(a);
  });
}

function renderPreview() {
  document.getElementById("hub-preview").innerHTML = previewStrip();
}

function renderExport() {
  const cs = getComputedStyle(document.documentElement);
  const keys = ["--background","--foreground","--card","--secondary","--muted-foreground","--border","--input",
    "--primary","--primary-foreground","--primary-hover","--ring","--destructive","--radius",
    "--font-heading","--font-body","--font-mono"];
  document.getElementById("hub-export").innerHTML =
    '<span class="c2">/* lefa design tokens — ' + DS.accent + "-" + DS.shade + " · " + DS.neutral + " · " +
    DS.fontHeading + " */</span>\n:root {\n" +
    keys.map((k) => "  <span class='c1'>" + k + "</span>: " + cs.getPropertyValue(k).trim() + ";").join("\n") +
    "\n}";
}

document.getElementById("hub-copy").addEventListener("click", () => {
  navigator.clipboard.writeText(document.getElementById("hub-export").innerText).then(() => {
    const b = document.getElementById("hub-copy");
    b.textContent = "Copied ✓";
    setTimeout(() => (b.textContent = "Copy tokens"), 1400);
  });
});
document.getElementById("hub-reset").addEventListener("click", () => {
  localStorage.removeItem("lefa-ds");
  location.reload();
});

function renderAll() { renderLinks(); renderPreview(); renderExport(); }
document.addEventListener("ds-change", renderAll);
renderAll();
</script>

</body>
</html>
