<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Typography — Lefa Design System Lab</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%2318181b'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='3' stroke-linejoin='round'%3E%3Cpolygon points='24,6 41.119,18.438 34.58,38.562 13.42,38.562 6.881,18.438'/%3E%3C/g%3E%3Ccircle cx='24' cy='24' r='4.5' fill='%23fff'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Fira+Code:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="ds.css" />
<style>
  .specimen h1, .specimen h2, .specimen h3, .specimen h4 { margin: 0 0 4px; }
  .specimen .sz { font-family: var(--font-mono); font-size: 10px; color: var(--faint); margin-left: 10px; letter-spacing: 0; }
  .specimen p { line-height: 1.7; color: var(--muted-foreground); max-width: 64ch; }
</style>
</head>
<body>

<div class="wrap">
  <div class="page-h">
    <h1>Typography</h1>
    <p>Heading and body can differ (or match — usually cleaner). Mono is for terminal output,
       code and metadata, so it carries a lot of Lefa's personality.</p>
  </div>

  <section class="block">
    <h2>Heading font</h2>
    <div class="opts wide" id="head-opts"></div>
  </section>

  <section class="block">
    <h2>Body font</h2>
    <div class="opts wide" id="body-opts"></div>
  </section>

  <section class="block">
    <h2>Mono font</h2>
    <div class="opts wide" id="mono-opts"></div>
  </section>

  <section class="block">
    <h2>Type scale</h2>
    <div class="opts" id="scale-opts"></div>
  </section>

  <section class="block">
    <h2>Specimen</h2>
    <div class="card"><div class="card-b specimen" id="specimen"></div></div>
  </section>
</div>

<script src="ds.js"></script>
<script>
"use strict";
dsNav("type.html");

function fontOpts(container, fonts, activeKey, patchKey) {
  optionGrid(container, fonts.map((f) => ({
    key: f, label: f, font: f,
    note: f === "Geist" || f === "Geist Mono" ? "vercel / shadcn default" : "",
  })), (k) => k === DS[activeKey], (k) => { const p = {}; p[activeKey] = k; saveDS(p); }, true);
}

function renderSpecimen() {
  const base = 16, r = parseFloat(DS.scale);
  const sizes = [base * r * r * r * r, base * r * r * r, base * r * r, base * r];
  const px = (v) => Math.round(v * 10) / 10 + "px";
  document.getElementById("specimen").innerHTML =
    '<h1 style="font-size:' + px(sizes[0]) + '">Give your agents eyes and hands<span class="sz">' + px(sizes[0]) + " · " + DS.fontHeading + '</span></h1>' +
    '<h2 style="font-size:' + px(sizes[1]) + '">Open computer use for Linux<span class="sz">' + px(sizes[1]) + "</span></h2>" +
    '<h3 style="font-size:' + px(sizes[2]) + '">Screenshots, a11y trees, native input<span class="sz">' + px(sizes[2]) + "</span></h3>" +
    '<h4 style="font-size:' + px(sizes[3]) + '">Exposed over MCP<span class="sz">' + px(sizes[3]) + "</span></h4>" +
    '<hr class="separator" />' +
    '<p style="margin-bottom:12px"><b>Body · ' + DS.fontBody + " · scale " + DS.scale + ".</b> Lefa is open-source computer use for the machines agents actually run on. " +
    "Screenshots, accessibility trees, and native input on any Linux box — exposed as clean MCP tools any model can drive. " +
    "The quick brown fox jumps over the lazy dog; 0123456789.</p>" +
    '<div class="codeblock"><span class="c2">$</span> lefa mcp\n<span class="c1">✓</span> lefad connected · session wayland · a11y tree ready\n<span class="c2">→</span> click(element=<span class="c1">42</span>)  <span class="c2"># ' + DS.fontMono + "</span></div>";
}

function renderAll() {
  fontOpts(document.getElementById("head-opts"), SANS_FONTS, "fontHeading");
  fontOpts(document.getElementById("body-opts"), SANS_FONTS, "fontBody");
  fontOpts(document.getElementById("mono-opts"), MONO_FONTS, "fontMono");
  optionGrid(document.getElementById("scale-opts"), TYPE_SCALES.map((s) => ({ key: s.key, label: s.label })),
    (k) => k === DS.scale, (k) => saveDS({ scale: k }));
  renderSpecimen();
}
document.addEventListener("ds-change", renderAll);
renderAll();
</script>

</body>
</html>
